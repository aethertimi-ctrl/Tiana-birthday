name: Verify
on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'design/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck, lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
